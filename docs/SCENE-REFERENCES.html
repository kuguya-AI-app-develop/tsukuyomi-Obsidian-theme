<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月读空间 · 电影画面参考</title>
<style>
  :root{color-scheme:dark;--ink:#101c29;--paper:#f3eddb;--muted:#b5c6c9;--sea:#86dcd2;--line:#344758}
  *{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.65 system-ui,-apple-system,sans-serif}
  main{max-width:1280px;margin:auto;padding:40px 28px 64px}h1{font-size:30px;margin:0 0 8px}header p{margin:0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:28px}figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#152432}
  .photo{display:block;background:#0c1520}.photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}
  figcaption{padding:18px 20px 20px}h2{font-size:20px;margin:0 0 10px}.id{display:inline-block;color:var(--sea);margin-right:10px}p{margin:7px 0}small{font-size:13px;color:var(--muted)}a{color:var(--sea);text-underline-offset:3px}
  .proposal{color:#e9cfaa}.source{margin-top:12px}footer{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted)}
  @media(max-width:760px){main{padding:24px 16px 40px}.grid{grid-template-columns:1fr;gap:22px}h1{font-size:25px}}
</style>
<main>
  <header>
    <h1>月读空间 · 电影画面参考</h1>
    <p>6 张完成画面，先看元素，再决定如何加入主题。点击画面可查看原图。</p>
    <p><small>2026-09-16 整理 · 图像来自制作方公开特报及制作访谈；下方“主题提案”为本项目建议，尚未实施。</small></p>
  </header>
  <section class="grid" aria-label="六组视觉参考">
    <figure>
      <a class="photo" href="https://cgworld.jp/article/262138b11df552477601755180b33380f374ae6c.jpg" target="_blank" rel="noopener"><img src="https://cgworld.jp/article/262138b11df552477601755180b33380f374ae6c.jpg" alt="月读城市全景，层叠屋檐、朱红楼身、暖窗与霓虹招牌"></a>
      <figcaption><h2><span class="id">A</span>层叠屋檐、暖窗与霓虹招牌</h2><p>看图重点：建筑高低错落；灯光沿檐下、窗格和店招分布，城市并非只有几个孤立楼阁。</p><p class="proposal">主题提案：增强空白页两侧建筑的前后层次，以暖窗和少量动物轮廓灯牌增加辨识度。</p><p class="source"><small>完成镜头 · <a href="https://cgworld.jp/article/cgw331-chokaguyahime03.html" target="_blank" rel="noopener">CGWORLD 制作访谈 No.3</a></small></p></figcaption>
    </figure>
    <figure>
      <a class="photo" href="https://cgworld.jp/article/e509a55ea9c61c63692c82c719eb91807804b0e1.jpg" target="_blank" rel="noopener"><img src="https://cgworld.jp/article/e509a55ea9c61c63692c82c719eb91807804b0e1.jpg" alt="仰视月读夜街，屋形船浮在建筑之间，船下有光纹"></a>
      <figcaption><h2><span class="id">B</span>浮空屋形船与青海波光纹</h2><p>看图重点：飞檐木楼与现代高层并置，橘色灯串连接建筑，空中船只下方有青海波纹与紫粉光线。</p><p class="proposal">主题提案：在空白页远处加入一艘缓慢经过的小船；将青海波化为局部边缘纹样。</p><p class="source"><small>完成镜头 · <a href="https://cgworld.jp/article/cgw331-chokaguyahime03.html" target="_blank" rel="noopener">CGWORLD 制作访谈 No.3</a></small></p></figcaption>
    </figure>
    <figure>
      <a class="photo" href="https://cgworld.jp/article/c12c1971fab5d2cb68831a9a164dc96d4b76dc53.jpg" target="_blank" rel="noopener"><img src="https://cgworld.jp/article/c12c1971fab5d2cb68831a9a164dc96d4b76dc53.jpg" alt="鸟居与樱树之间有不同形状的发光鱼和青紫轨迹"></a>
      <figcaption><h2><span class="id">C</span>鸟居、樱树与不同鱼形</h2><p>看图重点：暖木色大鸟居、粉色樱树，以及骨架、三角线框等不同光鱼轮廓。</p><p class="proposal">主题提案：让鸟居更接近场景的木构比例；以一小簇樱枝或两三种鱼形补充现有舞台。</p><p class="source"><small>完成镜头 · <a href="https://cgworld.jp/article/cgw331-chokaguyahime03.html" target="_blank" rel="noopener">CGWORLD 制作访谈 No.3</a></small></p></figcaption>
    </figure>
    <figure>
      <a class="photo" href="https://cgworld.jp/article/692d8fb87d7aecdb09634e41636f879e3ed006ed.jpg" target="_blank" rel="noopener"><img src="https://cgworld.jp/article/692d8fb87d7aecdb09634e41636f879e3ed006ed.jpg" alt="俯瞰月读街巷，暗色屋顶、金色窗光、少量竖向霓虹招牌"></a>
      <figcaption><h2><span class="id">D</span>暗瓦、金色窗光与街巷纵深</h2><p>看图重点：大面积深色屋顶托住小面积灯光，竖牌和屋脊光鱼形成局部细节。</p><p class="proposal">主题提案：优先研究这张的明暗比例。深色阅读界面保持安静，装饰区用暖色细线表现灯光层次。</p><p class="source"><small>实际电影镜头 · <a href="https://cgworld.jp/article/cgw331-chokaguyahime03.html" target="_blank" rel="noopener">CGWORLD 制作访谈 No.3</a></small></p></figcaption>
    </figure>
    <figure>
      <a class="photo" href="https://prcdn.freetls.fastly.net/release_image/32680/82/32680-82-2eabbd77e16e16d86ce3aadec791b94e-1920x1080.jpg?auto=webp&amp;bg-color=fff&amp;fit=bounds&amp;format=jpeg&amp;height=1350&amp;quality=85%2C65&amp;width=1950" target="_blank" rel="noopener"><img src="https://prcdn.freetls.fastly.net/release_image/32680/82/32680-82-2eabbd77e16e16d86ce3aadec791b94e-1920x1080.jpg?auto=webp&amp;bg-color=fff&amp;fit=bounds&amp;format=jpeg&amp;height=1350&amp;quality=85%2C65&amp;width=1950" alt="官方特报中的节庆城市，桥道、灯串与彩色光带穿过屋顶"></a>
      <figcaption><h2><span class="id">E</span>连接街区的彩带与灯串</h2><p>看图重点：曲线状桥道、光带和灯串穿过建筑，带来连续的空间感。</p><p class="proposal">主题提案：用一两条低饱和弧线连接空白页两侧景物，让场景连成一体，中央菜单留出完整空间。</p><p class="source"><small>官方特报画面 · <a href="https://prtimes.jp/main/html/rd/p/000000082.000032680.html" target="_blank" rel="noopener">制作方 Twin Engine 新闻稿</a></small></p></figcaption>
    </figure>
    <figure>
      <a class="photo" href="https://prcdn.freetls.fastly.net/release_image/32680/82/32680-82-e6b1c5199b09b4ea59d208206e3bd33b-1920x1080.jpg?auto=webp&amp;bg-color=fff&amp;fit=bounds&amp;format=jpeg&amp;height=1350&amp;quality=85%2C65&amp;width=1950" target="_blank" rel="noopener"><img src="https://prcdn.freetls.fastly.net/release_image/32680/82/32680-82-e6b1c5199b09b4ea59d208206e3bd33b-1920x1080.jpg?auto=webp&amp;bg-color=fff&amp;fit=bounds&amp;format=jpeg&amp;height=1350&amp;quality=85%2C65&amp;width=1950" alt="八千代身后的青、粉、黄光鱼形成远近不同的鱼群"></a>
      <figcaption><h2><span class="id">F</span>鱼群的色彩、远近与轻光晕</h2><p>看图重点：光鱼有不同大小与青、粉、黄色，亮度和清晰度也有区别。</p><p class="proposal">主题提案：保留目前单向游过的动作，进一步用少量远小近大的鱼、淡色填充和克制光晕表现深度。</p><p class="source"><small>官方特报画面 · <a href="https://prtimes.jp/main/html/rd/p/000000082.000032680.html" target="_blank" rel="noopener">制作方 Twin Engine 新闻稿</a></small></p></figcaption>
    </figure>
  </section>
  <footer>建议先比较 D 的明暗比例、B 的月读特色、E 的空间连接感。可按 A–F 告诉我希望保留的元素。原图仅在本参考页从来源站点显示，不进入主题安装包。</footer>
</main>
</html>
